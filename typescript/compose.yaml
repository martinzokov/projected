# Infrastructure for the integration tests and for running the examples against real services.
#   docker compose up -d --wait
#   pnpm test:integration
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: projected
      POSTGRES_PASSWORD: projected
      POSTGRES_DB: projected
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "projected"]
      interval: 2s
      retries: 30
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 3s
      retries: 40
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      retries: 30
